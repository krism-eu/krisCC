name: Final hardening gate

on:
  push:
    branches:
      - work/kriscc-hardening-0.8.1

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    container: fedora:45
    timeout-minutes: 35
    steps:
      - name: Install checkout dependency
        run: dnf -y --setopt=updates-testing.enabled=false install git
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Install strict toolchain
        run: >-
          dnf -y --setopt=updates-testing.enabled=false install
          gcc-c++ cmake ninja-build gzip python3 bash
          qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel
          bootc dnf5 dnf5-plugins rpm rpm-build tar qqc2-breeze-style
          ShellCheck cppcheck libxml2 appstream desktop-file-utils libarchive
      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find tests src -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          find tests src -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x
      - name: Release audit
        run: python3 ./tests/release-audit.py
      - name: Metadata validation
        shell: bash
        run: |
          set -euo pipefail
          xmllint --noout data/org.kriscc.controlcenter.policy data/org.kriscc.KrisCC.metainfo.xml
          desktop-file-validate data/krisCC.desktop
          appstreamcli validate --no-net data/org.kriscc.KrisCC.metainfo.xml
          rpmspec -P packaging/krisCC.spec >/tmp/kriscc.spec.expanded
      - name: Strict configure
        run: >-
          cmake -S . -B audit-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS=-Wall\ -Wextra\ -Wpedantic\ -Werror
      - name: Strict build
        run: cmake --build audit-build
      - name: CTest
        run: ctest --test-dir audit-build --output-on-failure
      - name: QML lint
        run: cmake --build audit-build --target krisCC_qmllint
      - name: C++ static analysis
        shell: bash
        run: |
          set -euo pipefail
          cppcheck --std=c++17 --library=qt --enable=warning,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --inline-suppr --quiet src
      - name: QML smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          KRISCC_SMOKE_TEST: '1'
          QT_FORCE_STDERR_LOGGING: '1'
        shell: bash
        run: |
          set -euo pipefail
          for style in Basic org.kde.breeze; do
            log="/tmp/kriscc-smoke-${style//\//_}.log"
            QT_QUICK_CONTROLS_STYLE="$style" ./audit-build/krisCC 2>&1 | tee "$log"
            ! grep -Ei 'Binding loop detected|Unable to assign|ReferenceError:|TypeError:|Created graphical object was not placed in the graphics scene|QQmlApplicationEngine failed|Type .* unavailable' "$log"
          done
      - name: Stage install
        shell: bash
        run: |
          set -euo pipefail
          DESTDIR="$PWD/stage" cmake --install audit-build --prefix /usr
          test -x stage/usr/bin/krisCC
          test -x stage/usr/libexec/kriscc/admin
          test -x stage/usr/libexec/kriscc/archive
          test -x stage/usr/libexec/kriscc/cleanup-estimate
          test -x stage/usr/libexec/kriscc/maintenance
      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^set(KRISCC_VERSION "\([^"]*\)")$/\1/p' cmake/KrisCCVersion.cmake)"
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar --exclude='./.git' --exclude='./audit-build' --exclude='./stage' --transform="s,^./,krisCC-${version}/," -czf "$HOME/rpmbuild/SOURCES/krisCC-${version}.tar.gz" .
          cp packaging/krisCC.spec "$HOME/rpmbuild/SPECS/krisCC.spec"
          rpmbuild -ba "$HOME/rpmbuild/SPECS/krisCC.spec"
          rpm_file="$(find "$HOME/rpmbuild/RPMS" -type f -name 'krisCC-*.rpm' | head -n1)"
          test -n "$rpm_file"
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/bin/krisCC'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc/archive'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc/cleanup-estimate'
