name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fedora:
    runs-on: ubuntu-24.04
    container: fedora:45
    outputs:
      version: ${{ steps.identity.outputs.version }}
      release: ${{ steps.identity.outputs.release }}
      version_release: ${{ steps.identity.outputs.version_release }}
      rpm: ${{ steps.identity.outputs.rpm }}
      source_txt: ${{ steps.identity.outputs.source_txt }}
    steps:
      - name: Install checkout dependency
        run: dnf -y --setopt=updates-testing.enabled=false install git

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      - name: Resolve build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^set(KRISCC_VERSION "\([^"]*\)")$/\1/p' cmake/KrisCCVersion.cmake)"
          release="1"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          vr="${version}-${release}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version_release=$vr" >> "$GITHUB_OUTPUT"
          echo "rpm=krisCC-${vr}.fc45.x86_64.rpm" >> "$GITHUB_OUTPUT"
          echo "source_txt=krisCC-${vr}-source.txt" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: >-
          dnf -y --setopt=updates-testing.enabled=false install gcc-c++ cmake ninja-build gzip python3
          qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel kf6-kidletime-devel
          bootc dnf5 dnf5-plugins rpm rpm-build tar qqc2-breeze-style

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: QML runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
          KRISCC_SMOKE_TEST: "1"
          QT_FORCE_STDERR_LOGGING: "1"
        shell: bash
        run: |
          set -euo pipefail
          smoke_failed=0
          for style in Basic org.kde.breeze; do
            log_file="$(mktemp)"
            if ! QT_QUICK_CONTROLS_STYLE="$style" ./build/krisCC 2>&1 | tee "$log_file"; then
              smoke_failed=1
            fi
            if grep -Ei 'Binding loop detected|Unable to assign|ReferenceError:|TypeError:|Created graphical object was not placed in the graphics scene|QQmlApplicationEngine failed|Type .* unavailable' "$log_file"; then
              echo "ERROR: QML runtime smoke failed for $style" >&2
              smoke_failed=1
            fi
            rm -f "$log_file"
          done
          test "$smoke_failed" -eq 0

      - name: Validate integration test syntax
        run: bash -n ./tests/e2e-readonly.sh

      - name: Read-only integration checks
        run: ./tests/e2e-readonly.sh

      - name: Cross-layer release audit
        run: python3 ./tests/release-audit.py

      - name: Validate RPM spec
        env:
          EXPECTED: ${{ steps.identity.outputs.version_release }}
        shell: bash
        run: |
          set -euo pipefail
          expanded_spec="$(mktemp)"
          trap 'rm -f "$expanded_spec"' EXIT
          rpmspec -P packaging/krisCC.spec > "$expanded_spec"
          test "$(rpmspec -q --qf '%{NAME}\n' packaging/krisCC.spec | head -n1)" = "krisCC"
          test "$(rpmspec -q --qf '%{VERSION}-%{RELEASE}\n' packaging/krisCC.spec | head -n1)" = "${EXPECTED}.fc45"
          ! grep -Eq '^Provides:[[:space:]]+(kcc|k-controlc)([[:space:]=]|$)' "$expanded_spec"
          ! grep -Eq '^Obsoletes:[[:space:]]+(kcc|k-controlc)([[:space:]<=>]|$)' "$expanded_spec"
          grep -Eq '^Requires:[[:space:]]+dnf5-plugins([[:space:]]|$)' "$expanded_spec"
          grep -Eq '^Requires:[[:space:]]+bash([[:space:]]|$)' "$expanded_spec"

      - name: Stage install
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          test -x stage/usr/bin/krisCC
          test -d stage/usr/libexec/kriscc
          test -x stage/usr/libexec/kriscc/admin
          test -x stage/usr/libexec/kriscc/bootc-status
          test -x stage/usr/libexec/kriscc/cleanup-estimate
          test -x stage/usr/libexec/kriscc/maintenance
          test -x stage/usr/libexec/kriscc/energy-profile
          test -f stage/usr/share/applications/krisCC.desktop
          test -f stage/usr/share/icons/hicolor/scalable/apps/krisCC.svg
          test -f stage/usr/share/polkit-1/actions/org.kriscc.controlcenter.policy
          test -f stage/usr/share/metainfo/org.kriscc.KrisCC.metainfo.xml
          test "$(QT_QPA_PLATFORM=offscreen stage/usr/bin/krisCC --version)" = "krisCC ${VERSION}"

      - name: Build binary RPM
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          RPM: ${{ steps.identity.outputs.rpm }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar -C "$GITHUB_WORKSPACE" \
            --exclude='./.git' \
            --exclude='./build' \
            --exclude='./stage' \
            --exclude='./artifacts' \
            --transform="s,^\\./,krisCC-${VERSION}/," \
            -czf "$HOME/rpmbuild/SOURCES/krisCC-${VERSION}.tar.gz" .
          cp "$GITHUB_WORKSPACE/packaging/krisCC.spec" "$HOME/rpmbuild/SPECS/krisCC.spec"
          rpmbuild -bb "$HOME/rpmbuild/SPECS/krisCC.spec"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/release"
          cp "$HOME/rpmbuild/RPMS/x86_64/$RPM" "$GITHUB_WORKSPACE/artifacts/release/$RPM"

      - name: Build exact source snapshot and checksums
        env:
          VERSION_RELEASE: ${{ steps.identity.outputs.version_release }}
          RPM: ${{ steps.identity.outputs.rpm }}
          SOURCE_TXT: ${{ steps.identity.outputs.source_txt }}
        shell: bash
        run: |
          set -euxo pipefail
          display_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          python3 tools/source_snapshot.py \
            --repository krism-eu/krisCC \
            --ref "$GITHUB_SHA" \
            --display-ref "$display_ref" \
            --version "$VERSION_RELEASE" \
            --output "artifacts/release/$SOURCE_TXT"
          grep -Fxq "# commit: $GITHUB_SHA" "artifacts/release/$SOURCE_TXT"
          grep -Fxq "# version-release: $VERSION_RELEASE" "artifacts/release/$SOURCE_TXT"
          (
            cd artifacts/release
            sha256sum "$RPM" "$SOURCE_TXT" > SHA256SUMS
            test "$(wc -l < SHA256SUMS)" -eq 2
            sha256sum -c SHA256SUMS
          )

      - name: Inspect built RPM artifact
        env:
          RPM: ${{ steps.identity.outputs.rpm }}
          EXPECTED: ${{ steps.identity.outputs.version_release }}
        shell: bash
        run: |
          set -euxo pipefail
          rpm_file="artifacts/release/$RPM"
          test -f "$rpm_file"
          test "$(rpm -qp --qf '%{NAME}\n' "$rpm_file")" = "krisCC"
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' "$rpm_file")" = "${EXPECTED}.fc45"
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/bin/krisCC'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc/admin'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc/bootc-status'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc/cleanup-estimate'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc/maintenance'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc/energy-profile'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/share/applications/krisCC.desktop'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/share/polkit-1/actions/org.kriscc.controlcenter.policy'
          rpm -qpR "$rpm_file" | grep -Eq '^polkit([[:space:]<=>]|$)'
          ! rpm -qp --provides "$rpm_file" | grep -Eq '^(kcc|k-controlc)([[:space:]=]|$)'
          (cd artifacts/release && sha256sum -c SHA256SUMS)
          stat --printf='Binary RPM bytes: %s\n' "$rpm_file"
          rpm -qp --qf 'Installed bytes: %{SIZE}\nPayload compressor: %{PAYLOADCOMPRESSOR}\n' "$rpm_file"
          echo 'Payload files: bytes, path (largest first)'
          rpm -qp --qf '[%{FILESIZES}\t%{FILENAMES}\n]' "$rpm_file" | sort -nr
          echo 'Release bundle: bytes, path'
          find artifacts/release -maxdepth 1 -type f -printf '%s\t%p\n' | sort -nr

      - name: Upload exact release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krisCC-release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

  release-audit:
    runs-on: ubuntu-24.04
    container: fedora:45
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install strict audit tooling
        run: >-
          dnf -y --setopt=updates-testing.enabled=false install
          gcc-c++ cmake ninja-build python3
          qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel kf6-kidletime-devel
          ShellCheck cppcheck libxml2 appstream desktop-file-utils

      - name: Semantic release contract
        run: python3 ./tests/release-audit.py

      - name: Shell syntax and ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          find tests src -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          find tests src -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x

      - name: XML AppStream and desktop metadata
        shell: bash
        run: |
          set -euo pipefail
          xmllint --noout data/org.kriscc.controlcenter.policy data/org.kriscc.KrisCC.metainfo.xml
          desktop-file-validate data/krisCC.desktop
          appstreamcli validate --no-net data/org.kriscc.KrisCC.metainfo.xml

      - name: Strict C++ build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B audit-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Werror'
          cmake --build audit-build

      - name: QML lint
        run: cmake --build audit-build --target krisCC_qmllint

      - name: C++ static analysis
        shell: bash
        run: |
          set -euo pipefail
          cppcheck \
            --std=c++17 \
            --library=qt \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            --quiet \
            src

  rpm-smoke:
    needs: build-fedora
    runs-on: ubuntu-24.04
    container: fedora:45
    steps:
      - name: Download exact release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: krisCC-release-${{ github.sha }}
          path: artifacts/release

      - name: Install and smoke-test built RPM
        env:
          RPM: ${{ needs.build-fedora.outputs.rpm }}
          EXPECTED: ${{ needs.build-fedora.outputs.version_release }}
          VERSION: ${{ needs.build-fedora.outputs.version }}
          SOURCE_TXT: ${{ needs.build-fedora.outputs.source_txt }}
        shell: bash
        run: |
          set -euxo pipefail
          rpm_file="$GITHUB_WORKSPACE/artifacts/release/$RPM"
          test -f "$rpm_file"
          (cd "$GITHUB_WORKSPACE/artifacts/release" && sha256sum -c SHA256SUMS)
          grep -Fxq "# commit: $GITHUB_SHA" "$GITHUB_WORKSPACE/artifacts/release/$SOURCE_TXT"
          dnf -y --setopt=updates-testing.enabled=false install "$rpm_file"
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}\n' krisCC)" = "${EXPECTED}.fc45"
          rpm -V krisCC
          test -z "$(ldd /usr/bin/krisCC | awk '/not found/{print}')"
          test "$(QT_QPA_PLATFORM=offscreen /usr/bin/krisCC --version)" = "krisCC ${VERSION}"
          test -x /usr/libexec/kriscc/admin
          test -x /usr/libexec/kriscc/bootc-status
          test -x /usr/libexec/kriscc/cleanup-estimate
          test -x /usr/libexec/kriscc/maintenance
          ! /usr/libexec/kriscc/admin invalid-operation
          ! /usr/libexec/kriscc/maintenance trash-home
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic KRISCC_SMOKE_TEST=1 QT_FORCE_STDERR_LOGGING=1 /usr/bin/krisCC --background

  publish-testing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-fedora, rpm-smoke, release-audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: krisCC-release-${{ github.sha }}
          path: artifacts/release

      - name: Publish automatic testing channel
        env:
          RPM: ${{ needs.build-fedora.outputs.rpm }}
          SOURCE_TXT: ${{ needs.build-fedora.outputs.source_txt }}
          VERSION_RELEASE: ${{ needs.build-fedora.outputs.version_release }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release
          test -f "$RPM"
          test -f "$SOURCE_TXT"
          test "$(wc -l < SHA256SUMS)" -eq 2
          sha256sum -c SHA256SUMS
          grep -Fxq "# commit: $GITHUB_SHA" "$SOURCE_TXT"
          grep -Fxq "# version-release: $VERSION_RELEASE" "$SOURCE_TXT"

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current_main" = "$GITHUB_SHA"

          if gh release view testing --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete testing --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/testing" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/testing"
          fi

          short_sha="${GITHUB_SHA:0:12}"
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          cat > "$notes_file" <<EOF
          Automatically updated testing build.

          Exact validated commit: $GITHUB_SHA
          Version-release: $VERSION_RELEASE

          Test this RPM on KrisOS. To promote this exact build later, run "Promote stable release" and enter the commit above.
          EOF
          gh release create testing \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "krisCC testing · $short_sha" \
            --prerelease \
            --latest=false \
            --notes-file "$notes_file" \
            "$RPM" "$SOURCE_TXT" SHA256SUMS
