name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish the validated main artifact as an immutable prerelease candidate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    outputs:
      version: ${{ steps.identity.outputs.version }}
      release: ${{ steps.identity.outputs.release }}
      version_release: ${{ steps.identity.outputs.version_release }}
      rpm: ${{ steps.identity.outputs.rpm }}
      source_zip: ${{ steps.identity.outputs.source_zip }}
      source_txt: ${{ steps.identity.outputs.source_txt }}
    steps:
      - name: Install checkout dependency
        run: dnf -y install git

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      - name: Resolve candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^set(KRISCC_VERSION "\([^"]*\)")$/\1/p' cmake/KrisCCVersion.cmake)"
          release="1"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          vr="${version}-${release}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version_release=$vr" >> "$GITHUB_OUTPUT"
          echo "rpm=krisCC-${vr}.fc44.x86_64.rpm" >> "$GITHUB_OUTPUT"
          echo "source_zip=krisCC-${vr}-source.zip" >> "$GITHUB_OUTPUT"
          echo "source_txt=krisCC-${vr}-source.txt" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: >-
          dnf -y install gcc-c++ cmake ninja-build gzip python3
          qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel
          bootc dnf5 dnf5-plugins rpm rpm-build tar qqc2-breeze-style

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: QML runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
          KRISCC_SMOKE_TEST: "1"
          QT_FORCE_STDERR_LOGGING: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          smoke_failed=0
          for style in Basic org.kde.breeze; do
            QT_QUICK_CONTROLS_STYLE="$style" ./build/krisCC 2>&1 | tee "artifacts/logs/kriscc-qml-smoke-$style.log" || smoke_failed=1
            if grep -Ei 'Binding loop detected|Unable to assign|ReferenceError:|TypeError:|Created graphical object was not placed in the graphics scene|QQmlApplicationEngine failed|Type .* unavailable' "artifacts/logs/kriscc-qml-smoke-$style.log"; then
              echo "ERROR: QML runtime smoke failed for $style" >&2
              smoke_failed=1
            fi
          done
          test "$smoke_failed" -eq 0

      - name: Validate integration test syntax
        run: bash -n ./tests/e2e-readonly.sh

      - name: Read-only integration checks
        run: ./tests/e2e-readonly.sh

      - name: Cross-layer release audit
        run: python3 ./tests/release-audit.py

      - name: GNU tar restore traversal contract
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp" /kriscc-absolute-escape-test' EXIT
          mkdir -p "$tmp/out-parent" "$tmp/out-absolute" "$tmp/out-symlink"
          python3 - "$tmp" <<'PY'
          import io
          import pathlib
          import sys
          import tarfile

          root = pathlib.Path(sys.argv[1])
          payload = b"blocked\n"

          with tarfile.open(root / "parent.tar.gz", "w:gz") as tar:
              info = tarfile.TarInfo("../escape.txt")
              info.size = len(payload)
              tar.addfile(info, io.BytesIO(payload))

          with tarfile.open(root / "absolute.tar.gz", "w:gz") as tar:
              info = tarfile.TarInfo("/kriscc-absolute-escape-test")
              info.size = len(payload)
              tar.addfile(info, io.BytesIO(payload))

          with tarfile.open(root / "symlink.tar.gz", "w:gz") as tar:
              link = tarfile.TarInfo("link")
              link.type = tarfile.SYMTYPE
              link.linkname = "../../kriscc-symlink-escape"
              tar.addfile(link)
              info = tarfile.TarInfo("link/pwn.txt")
              info.size = len(payload)
              tar.addfile(info, io.BytesIO(payload))
          PY

          if tar -xzf "$tmp/parent.tar.gz" --no-same-owner --no-same-permissions -C "$tmp/out-parent"; then
            echo "ERROR: GNU tar accepted a ../ member" >&2
            exit 1
          fi
          test ! -e "$tmp/escape.txt"

          tar -xzf "$tmp/absolute.tar.gz" --no-same-owner --no-same-permissions -C "$tmp/out-absolute" || true
          test ! -e /kriscc-absolute-escape-test
          test -f "$tmp/out-absolute/kriscc-absolute-escape-test"

          if tar -xzf "$tmp/symlink.tar.gz" --no-same-owner --no-same-permissions -C "$tmp/out-symlink"; then
            echo "ERROR: GNU tar followed an escaping symlink member" >&2
            exit 1
          fi
          test ! -e "$tmp/kriscc-symlink-escape"

      - name: Validate RPM spec
        env:
          EXPECTED: ${{ steps.identity.outputs.version_release }}
        shell: bash
        run: |
          set -euo pipefail
          expanded_spec="$(mktemp)"
          trap 'rm -f "$expanded_spec"' EXIT
          rpmspec -P packaging/krisCC.spec > "$expanded_spec"
          test "$(rpmspec -q --qf '%{NAME}\n' packaging/krisCC.spec | head -n1)" = "krisCC"
          test "$(rpmspec -q --qf '%{VERSION}-%{RELEASE}\n' packaging/krisCC.spec | head -n1)" = "${EXPECTED}.fc44"
          ! grep -Eq '^Provides:[[:space:]]+(kcc|k-controlc)([[:space:]=]|$)' "$expanded_spec"
          ! grep -Eq '^Obsoletes:[[:space:]]+(kcc|k-controlc)([[:space:]<=>]|$)' "$expanded_spec"
          grep -Eq '^Requires:[[:space:]]+dnf5-plugins([[:space:]]|$)' "$expanded_spec"
          grep -Eq '^Requires:[[:space:]]+bash([[:space:]]|$)' "$expanded_spec"

      - name: Stage install
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          test -x stage/usr/bin/krisCC
          test -x stage/usr/libexec/kriscc/admin
          test -x stage/usr/libexec/kriscc/bootc-status
          test -x stage/usr/libexec/kriscc/maintenance
          test -f stage/usr/share/applications/krisCC.desktop
          test -f stage/usr/share/icons/hicolor/scable/apps/krisCC.svg
          test -f stage/usr/share/polkit-1/actions/org.kriscc.controlcenter.policy
          test -f stage/usr/share/metainfo/org.kriscc.KrisCC.metainfo.xml
          test "$(QT_QPA_PLATFORM=offscreen stage/usr/bin/krisCC --version)" = "krisCC ${VERSION}"
          tar -C stage -czf krisCC-stage.tar.gz .

      - name: Build RPM
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          RPM: ${{ steps.identity.outputs.rpm }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"
          (
            set -euxo pipefail
            mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
            tar -C "$GITHUB_WORKSPACE" \
              --exclude='./.git' \
              --exclude='./build' \
              --exclude='./stage' \
              --exclude='./artifacts' \
              --exclude='./krisCC-stage.tar.gz' \
              --transform="s,^\\./,krisCC-${VERSION}/," \
              -czf "$HOME/rpmbuild/SOURCES/krisCC-${VERSION}.tar.gz" .
            cp "$GITHUB_WORKSPACE/packaging/krisCC.spec" "$HOME/rpmbuild/SPECS/krisCC.spec"
            rpmbuild -ba "$HOME/rpmbuild/SPECS/krisCC.spec"
            mkdir -p "$GITHUB_WORKSPACE/artifacts/rpm" "$GITHUB_WORKSPACE/artifacts/srpm" "$GITHUB_WORKSPACE/artifacts/stage"
            cp "$HOME"/rpmbuild/RPMS/*/krisCC-*.rpm "$GITHUB_WORKSPACE/artifacts/rpm/"
            cp "$HOME"/rpmbuild/SRPMS/krisCC-*.src.rpm "$GITHUB_WORKSPACE/artifacts/srpm/"
            cp "$GITHUB_WORKSPACE/krisCC-stage.tar.gz" "$GITHUB_WORKSPACE/artifacts/stage/"
            cd "$GITHUB_WORKSPACE/artifacts/rpm"
            sha256sum krisCC-*.rpm > SHA256SUMS
            awk -v f="$RPM" '$2 == f { found++ } END { exit(found == 1 ? 0 : 1) }' SHA256SUMS
          ) 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/rpmbuild.log"

      - name: Build exact source bundle
        env:
          VERSION_RELEASE: ${{ steps.identity.outputs.version_release }}
          RPM: ${{ steps.identity.outputs.rpm }}
          SOURCE_ZIP: ${{ steps.identity.outputs.source_zip }}
          SOURCE_TXT: ${{ steps.identity.outputs.source_txt }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/source artifacts/release
          display_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          python3 tools/source_snapshot.py \
            --repository krism-eu/krisCC \
            --ref "$GITHUB_SHA" \
            --display-ref "$display_ref" \
            --version "$VERSION_RELEASE" \
            --output "artifacts/source/$SOURCE_TXT"
          git archive \
            --format=zip \
            --prefix="krisCC-${VERSION_RELEASE}/" \
            --output="artifacts/source/$SOURCE_ZIP" \
            "$GITHUB_SHA"
          grep -Fxq "# commit: $GITHUB_SHA" "artifacts/source/$SOURCE_TXT"
          grep -Fxq "# version-release: $VERSION_RELEASE" "artifacts/source/$SOURCE_TXT"
          python3 -m zipfile -t "artifacts/source/$SOURCE_ZIP"
          cp "artifacts/rpm/$RPM" "artifacts/release/$RPM"
          cp "artifacts/source/$SOURCE_ZIP" "artifacts/release/$SOURCE_ZIP"
          cp "artifacts/source/$SOURCE_TXT" "artifacts/release/$SOURCE_TXT"
          (
            cd artifacts/release
            sha256sum "$RPM" "$SOURCE_ZIP" "$SOURCE_TXT" > SHA256SUMS
            test "$(wc -l < SHA256SUMS)" -eq 3
            sha256sum -c SHA256SUMS
          )

      - name: Inspect built RPM artifact
        env:
          RPM: ${{ steps.identity.outputs.rpm }}
          EXPECTED: ${{ steps.identity.outputs.version_release }}
        shell: bash
        run: |
          set -euxo pipefail
          rpm_file="artifacts/rpm/$RPM"
          test -f "$rpm_file"
          test "$(rpm -qp --qf '%{NAME}\n' "$rpm_file")" = "krisCC"
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' "$rpm_file")" = "${EXPECTED}.fc44"
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/bin/krisCC'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc/admin'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc/bootc-status'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/libexec/kriscc/maintenance'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/share/applications/krisCC.desktop'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/share/polkit-1/actions/org.kriscc.controlcenter.policy'
          rpm -qpR "$rpm_file" | grep -Eq '^polkit([[:space:]<=>]|$)'
          ! rpm -qp --provides "$rpm_file" | grep -Eq '^(kcc|k-controlc)([[:space:]=]|$)'
          (cd artifacts/rpm && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: krisCC-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn

  release-audit:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install strict audit tooling
        run: >-
          dnf -y install gcc-c++ cmake ninja-build python3
          qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel
          ShellCheck cppcheck libxml2 appstream desktop-file-utils

      - name: Semantic release contract
        run: python3 ./tests/release-audit.py

      - name: Shell syntax and ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/e2e-readonly.sh
          find tests -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 shellcheck -x

      - name: XML AppStream and desktop metadata
        shell: bash
        run: |
          set -euo pipefail
          xmllint --noout data/org.kriscc.controlcenter.policy data/org.kriscc.KrisCC.metainfo.xml
          desktop-file-validate data/krisCC.desktop
          appstreamcli validate --no-net data/org.kriscc.KrisCC.metainfo.xml

      - name: Strict C++ build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B audit-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Werror'
          cmake --build audit-build

      - name: QML lint
        run: cmake --build audit-build --target krisCC_qmllint

      - name: C++ static analysis
        shell: bash
        run: |
          set -euo pipefail
          cppcheck \
            --std=c++17 \
            --library=qt \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            --quiet \
            src

  rpm-smoke:
    needs: build-fedora
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: krisCC-${{ github.sha }}
          path: artifacts

      - name: Install and smoke-test built RPM
        env:
          RPM: ${{ needs.build-fedora.outputs.rpm }}
          EXPECTED: ${{ needs.build-fedora.outputs.version_release }}
          VERSION: ${{ needs.build-fedora.outputs.version }}
          SOURCE_TXT: ${{ needs.build-fedora.outputs.source_txt }}
        shell: bash
        run: |
          set -euxo pipefail
          rpm_file="$GITHUB_WORKSPACE/artifacts/release/$RPM"
          test -f "$rpm_file"
          (cd "$GITHUB_WORKSPACE/artifacts/release" && sha256sum -c SHA256SUMS)
          grep -Fxq "# commit: $GITHUB_SHA" "$GITHUB_WORKSPACE/artifacts/release/$SOURCE_TXT"
          dnf -y install "$rpm_file"
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}\n' krisCC)" = "${EXPECTED}.fc44"
          rpm -V krisCC
          test "$(QT_QPA_PLATFORM=offscreen /usr/bin/krisCC --version)" = "krisCC ${VERSION}"
          test -x /usr/libexec/kriscc/admin
          test -x /usr/libexec/kriscc/bootc-status
          test -x /usr/libexec/kriscc/maintenance
          ! /usr/libexec/kriscc/admin invalid-operation
          ! /usr/libexec/kriscc/maintenance trash-home
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic KRISCC_SMOKE_TEST=1 QT_FORCE_STDERR_LOGGING=1 /usr/bin/krisCC --background

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_candidate
    needs: [build-fedora, rpm-smoke, release-audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: krisCC-${{ github.sha }}
          path: artifacts

      - name: Resolve immutable component release
        id: component
        env:
          RPM: ${{ needs.build-fedora.outputs.rpm }}
          SOURCE_ZIP: ${{ needs.build-fedora.outputs.source_zip }}
          SOURCE_TXT: ${{ needs.build-fedora.outputs.source_txt }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3
          test -f "$RPM"
          test -f "$SOURCE_ZIP"
          test -f "$SOURCE_TXT"
          base="$RPM"
          if [[ ! "$base" =~ ^krisCC-([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)\.fc44\.x86_64\.rpm$ ]]; then
            echo "Unexpected RPM filename: $base" >&2
            exit 1
          fi
          test "${BASH_REMATCH[2]}" = "1"
          tag="v${BASH_REMATCH[1]}"
          grep -Fxq "# commit: $GITHUB_SHA" "$SOURCE_TXT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "rpm=$RPM" >> "$GITHUB_OUTPUT"
          echo "source_zip=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
          echo "source_txt=$SOURCE_TXT" >> "$GITHUB_OUTPUT"

      - name: Publish or verify component release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.component.outputs.tag }}
          RPM: ${{ steps.component.outputs.rpm }}
          SOURCE_ZIP: ${{ steps.component.outputs.source_zip }}
          SOURCE_TXT: ${{ steps.component.outputs.source_txt }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/artifacts/release"
          cd "$release_dir"
          sha256sum -c SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            release_target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            release_target_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_target" --jq '.sha')"
            release_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$release_target_sha" --jq '.tree.sha')"
            main_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '.tree.sha')"
            test "$release_tree" = "$main_tree"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              -p "$RPM" -p "$SOURCE_ZIP" -p "$SOURCE_TXT" -p SHA256SUMS -D "$tmp"
            (
              cd "$tmp"
              test "$(wc -l < SHA256SUMS)" -eq 3
              sha256sum -c SHA256SUMS
              grep -Fxq "# commit: $release_target_sha" "$SOURCE_TXT"
              test "$(rpm -qp --qf '%{NAME}' "$RPM")" = 'krisCC'
              test "$(rpm -qp --qf '%{VERSION}' "$RPM")" = "${TAG#v}"
              test "$(rpm -qp --qf '%{RELEASE}' "$RPM")" = "1.fc44"
            )
            echo "Verified existing $TAG bundle; refusing divergent overwrite."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "krisCC $TAG" \
            --prerelease \
            --notes "CI-tested krisCC candidate built from $GITHUB_SHA. RPM, source ZIP and combined source TXT are checksummed together. Stable promotion requires KrisOS host acceptance." \
            "$RPM" "$SOURCE_ZIP" "$SOURCE_TXT" SHA256SUMS
