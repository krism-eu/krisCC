name: Promote stable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated prerelease tag (for example v0.7.3)
        required: true
        type: string
      host_acceptance_confirmed:
        description: KrisOS host acceptance test completed successfully
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      HOST_ACCEPTANCE_CONFIRMED: ${{ inputs.host_acceptance_confirmed }}
    steps:
      - name: Require explicit host acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$HOST_ACCEPTANCE_CONFIRMED" = "true"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Install RPM inspection tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Verify immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "true"

          release_target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_target" --jq '.sha')"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          compare_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$release_sha...$main_sha" --jq '.status')"
          test "$compare_status" = "ahead" -o "$compare_status" = "identical"

          version="${TAG#v}"
          rpm_file="krisCC-${version}-1.fc44.x86_64.rpm"
          source_zip="krisCC-${version}-1-source.zip"
          source_txt="krisCC-${version}-1-source.txt"

          rm -rf /tmp/kriscc-promote
          mkdir -p /tmp/kriscc-promote
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p "$rpm_file" -p "$source_zip" -p "$source_txt" -p SHA256SUMS \
            -D /tmp/kriscc-promote
          cd /tmp/kriscc-promote

          test "$(awk 'END {print NR}' SHA256SUMS)" -eq 3
          sha256sum -c SHA256SUMS
          test -f "$rpm_file"
          test -f "$source_zip"
          test -f "$source_txt"
          grep -Fxq "# commit: $release_sha" "$source_txt"
          grep -Fxq "# version-release: ${version}-1" "$source_txt"

          test "$(rpm -qp --qf '%{NAME}' "$rpm_file")" = "krisCC"
          test "$(rpm -qp --qf '%{VERSION}' "$rpm_file")" = "$version"
          test "$(rpm -qp --qf '%{RELEASE}' "$rpm_file")" = "1.fc44"

      - name: Promote exact candidate to stable
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest
