name: Promote stable release

on:
  workflow_dispatch:
    inputs:
      tested_commit:
        description: Commit shown in the testing release that was tested on KrisOS
        required: true
        type: string
      host_acceptance_confirmed:
        description: KrisOS host acceptance test completed successfully for this commit
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TESTED_COMMIT: ${{ inputs.tested_commit }}
      HOST_ACCEPTANCE_CONFIRMED: ${{ inputs.host_acceptance_confirmed }}
    steps:
      - name: Require explicit host acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$HOST_ACCEPTANCE_CONFIRMED" = "true"
          [[ "$TESTED_COMMIT" =~ ^[0-9A-Fa-f]{7,40}$ ]]

      - name: Install RPM inspection tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Resolve tested commit and successful build
        id: tested
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_COMMIT" --jq '.sha')"
          [[ "$tested_sha" =~ ^[0-9a-f]{40}$ ]]

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          compare_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$tested_sha...$main_sha" --jq '.status')"
          test "$compare_status" = "ahead" -o "$compare_status" = "identical"

          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --commit "$tested_sha" \
            --event push \
            --status success \
            --limit 20 \
            --json databaseId,headSha,conclusion \
            --jq "map(select(.headSha == \"$tested_sha\" and .conclusion == \"success\")) | .[0].databaseId // empty")"
          test -n "$run_id"

          echo "sha=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact CI artifact that was tested
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          RUN_ID: ${{ steps.tested.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kriscc-promote
          mkdir -p /tmp/kriscc-promote
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "krisCC-release-$TESTED_SHA" \
            --dir /tmp/kriscc-promote

      - name: Verify exact release bundle
        id: bundle
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/kriscc-promote
          shopt -s nullglob
          rpms=(krisCC-*.fc45.x86_64.rpm)
          source_files=(krisCC-*-source.txt)
          test "${#rpms[@]}" -eq 1
          test "${#source_files[@]}" -eq 1
          rpm_file="${rpms[0]}"
          source_txt="${source_files[0]}"

          test -f SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
          sha256sum -c SHA256SUMS
          grep -Fxq "# commit: $TESTED_SHA" "$source_txt"

          version_release="$(sed -n 's/^# version-release: //p' "$source_txt")"
          [[ "$version_release" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-1$ ]]
          version="${BASH_REMATCH[1]}"
          tag="v$version"

          test "$rpm_file" = "krisCC-${version_release}.fc45.x86_64.rpm"
          test "$source_txt" = "krisCC-${version_release}-source.txt"
          test "$(rpm -qp --qf '%{NAME}' "$rpm_file")" = "krisCC"
          test "$(rpm -qp --qf '%{VERSION}' "$rpm_file")" = "$version"
          test "$(rpm -qp --qf '%{RELEASE}' "$rpm_file")" = "1.fc45"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "rpm=$rpm_file" >> "$GITHUB_OUTPUT"
          echo "source_txt=$source_txt" >> "$GITHUB_OUTPUT"

      - name: Publish exact tested build as stable
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          TAG: ${{ steps.bundle.outputs.tag }}
          RPM: ${{ steps.bundle.outputs.rpm }}
          SOURCE_TXT: ${{ steps.bundle.outputs.source_txt }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/kriscc-promote

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$existing_target" --jq '.sha')"
            test "$existing_sha" = "$TESTED_SHA"

            verify_dir="$(mktemp -d)"
            trap 'rm -rf "$verify_dir"' EXIT
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              -p "$RPM" -p "$SOURCE_TXT" -p SHA256SUMS \
              -D "$verify_dir"
            (
              cd "$verify_dir"
              test "$(wc -l < SHA256SUMS)" -eq 2
              sha256sum -c SHA256SUMS
              cmp -s "$RPM" "/tmp/kriscc-promote/$RPM"
              cmp -s "$SOURCE_TXT" "/tmp/kriscc-promote/$SOURCE_TXT"
              cmp -s SHA256SUMS /tmp/kriscc-promote/SHA256SUMS
            )
            echo "$TAG is already the exact tested stable release."
            exit 0
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            test "$tag_sha" = "$TESTED_SHA"
            tag_args=(--verify-tag)
          else
            tag_args=(--target "$TESTED_SHA")
          fi

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          cat > "$notes_file" <<EOF
          Stable krisCC release promoted from the exact CI artifact tested on KrisOS.

          Tested commit: $TESTED_SHA
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${tag_args[@]}" \
            --title "krisCC $TAG" \
            --latest \
            --notes-file "$notes_file" \
            "$RPM" "$SOURCE_TXT" SHA256SUMS
